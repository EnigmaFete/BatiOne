services:
  postgres:
    image: postgres:16-alpine
    container_name: batione-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: batione
      POSTGRES_PASSWORD: batione
      POSTGRES_DB: batione
    ports:
      - '5432:5432'
    volumes:
      - batione_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U batione']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  batione_postgres_data:
